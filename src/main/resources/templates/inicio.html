<!DOCTYPE html>
<html lang="pt-br" data-theme="nord">
<head>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Início</title>

    <!-- Estilos DaisyUI + Tailwind -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/dist/full.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-base-200 min-h-screen">

    <!-- Navbar -->
    <div class="navbar bg-base-100 shadow-sm">
        <div class="flex-1">
            <a class="text-l"><strong>Fredly</strong></a>
        </div>
        <div class="flex-none">
            <button class="btn btn-ghost btn-circle" aria-label="Menu">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>
        </div>
    </div>
    
    <header class="p-6 text-center">
        <h1 class="text-3xl font-bold mb-4">Lista de Eventos</h1>
        <a href="/cadastrarEvento" class="btn btn-primary">Crie um evento agora</a>
    </header>

    <div class="overflow-x-auto px-6 pb-12">
        <table class="table table-zebra w-full text-center shadow-md rounded-box bg-base-100">
            <thead class="bg-neutral text-neutral-content">
                <tr>
                    <th>Nome</th>
                    <th>Tipo</th>
                    <th>Local</th>
                    <th>Data</th>
                    <th>Horário</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="evento : ${eventos}">
                    <td th:text="${evento.nome}"></td>
                    <td th:text="${evento.tipo}"></td>
                    <td th:text="${evento.local}"></td>
                    <td th:text="${evento.data}"></td>
                    <td th:text="${evento.horario}"></td>
                    <td>
                        <a th:href="@{/detalhesEvento/{codigo}(codigo=${evento.codigo})}" class="btn btn-outline btn-sm">
                            Ver detalhes
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
